[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-trace-via-calculator"
version = "1.0.0"
description = "Compact PCB trace width and plated via geometry calculator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
pcb-calc = "pcb_calculator.cli:main"

[tool.setuptools.packages.find]
include = ["pcb_calculator*"]
